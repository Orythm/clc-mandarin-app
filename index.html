<style>
/* Layout: prompt card on top (pinyin), 40-tile character board below, progress rail in the header */
:root{
  --bg:#f3f4f1; --paper:#fff; --fg:#1d2320; --muted:#68716c; --line:#dde1dc;
  --accent:#a3322a; --ok:#2f7a4a; --ok-soft:#e3f1e8; --bad:#b3362c; --bad-soft:#f7e3e0;
  --f-hand:"Source Serif 4","DFKai-SB","BiauKai","TW-Kai","Noto Serif TC","PMingLiU",serif;
  --f-py:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --paper:#1d2320; --fg:#e7ece8; --muted:#9ba59f; --line:#2f3733;
  --accent:#e0776c; --ok:#6cc48d; --ok-soft:#1e3327; --bad:#ec7b70; --bad-soft:#3b2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --paper:#1d2320; --fg:#e7ece8; --muted:#9ba59f; --line:#2f3733;
  --accent:#e0776c; --ok:#6cc48d; --ok-soft:#1e3327; --bad:#ec7b70; --bad-soft:#3b2220; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-py)}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
h1{font-family:var(--f-hand);font-size:1.8rem;margin:0}
.meta{font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg)}
.rail{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;text-align:center;display:grid;gap:6px;min-height:150px;align-content:center}
.py{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:600;letter-spacing:.01em}
.hint{color:var(--muted);font-style:italic;font-size:1.05rem;min-height:1.4em}
.fb{font-size:1.15rem;min-height:1.6em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb .zh{font-family:var(--f-hand);font-size:1.6rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;cursor:pointer}
.btn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 14px;font-size:1rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-family:var(--f-hand);font-size:1.9rem;color:var(--fg);min-height:70px;transition:background .15s,border-color .15s}
.tile:hover{border-color:var(--muted)}
.tile.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tile.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tile:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.results{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:grid;gap:12px}
.results h2{font-family:var(--f-hand);font-size:1.6rem;margin:0}
.score{font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.miss{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline}
.miss .zh{font-family:var(--f-hand);font-size:1.7rem}
.miss .en{color:var(--muted);font-style:italic}
.prompt{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
@media (max-width:560px){
  .wrap{gap:10px;padding-block:12px 32px}
  h1{font-size:1.4rem}
  .prompt{min-height:0;padding:12px}
  .py{font-size:2.1rem}
  .board{grid-template-columns:repeat(5,1fr);gap:6px}
  .tile{font-size:1.2rem;min-height:54px;padding:6px 2px;white-space:nowrap}
}

.py.zhq{font-family:var(--f-hand);font-weight:700;font-size:clamp(3rem,10vw,4.4rem)}
.board.pyb .tile{font-family:var(--f-py);font-size:1.15rem}
.board.pyb{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.menu{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 16px;display:grid;gap:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:left;color:var(--fg);display:grid;gap:6px}
.mode:hover{border-color:var(--accent)}
.mode .ex{font-size:1.6rem;display:flex;align-items:baseline;gap:10px}
.mode .ex .h{font-family:var(--f-hand);font-size:2rem}
.mode .ex .arr{color:var(--accent)}
.mode .lbl{font-weight:600;font-size:1.1rem}
.mode .sub{color:var(--muted);font-size:.95rem}
.btn.toggle[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--paper)}
.tile.match{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.dim{opacity:.35}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.homebtn{padding:6px 12px;font-size:.95rem}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:1rem;text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){
  .board.pyb{grid-template-columns:repeat(4,1fr)}
  .board.pyb .tile{font-size:.9rem;white-space:normal;line-height:1.2}
  .py.zhq{font-size:3rem}
}
.lessons{display:grid;gap:18px}
.lesson h2{font-family:var(--f-hand);font-size:1.4rem;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
.lesson h2 small{font-family:var(--f-py);font-size:.9rem;color:var(--muted);font-weight:400}
.mode{padding:14px}
.mode .ex{font-size:1.3rem}
.mode .ex .h{font-size:1.6rem}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;text-align:left;color:var(--fg);display:grid;gap:6px;align-content:start}
button.card:hover{border-color:var(--accent)}
.card .ic{font-family:var(--f-hand);font-size:2.2rem;color:var(--accent);line-height:1.1}
.card .lbl{font-weight:600;font-size:1.2rem}
.card .sub{color:var(--muted);font-size:.95rem}
.card.soon{background:none;border-style:dashed;color:var(--muted)}
.card.soon .ic{color:var(--muted)}
.dict{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:grid;gap:14px;justify-items:center;text-align:center}
.play{font-size:1.15rem;padding:12px 22px;border-radius:999px}
.dict .hint{min-height:0}
.dict .hint .zh{font-family:var(--f-hand);font-style:normal;font-size:2rem;color:var(--fg)}
.pyin{font:inherit;font-size:1.6rem;width:min(100%,360px);box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);text-align:center}
.pyin:focus{outline:2px solid var(--accent);outline-offset:1px}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-family:var(--f-py);font-size:clamp(2.2rem,8vw,3rem);font-weight:600}
.syl{display:inline-flex;align-items:baseline}
.lt{background:none;border:0;border-bottom:2px dotted var(--accent);border-radius:4px 4px 0 0;color:var(--fg);font:inherit;padding:0 3px;margin:0 1px;min-width:1.1ch;line-height:1.3}
.lt:hover{background:var(--bg)}
.lt.set{border-bottom-style:solid}
.lt:disabled{cursor:default;border-bottom-color:transparent}
.lt.ok{color:var(--ok);background:var(--ok-soft)}
.lt.bad{color:var(--bad);background:var(--bad-soft)}
.cs{padding:0 1px;line-height:1.3}
.sep{color:var(--muted);padding:0 2px}
.dict .sub{color:var(--muted);font-size:.95rem}
.info{align-self:center;width:1.6rem;height:1.6rem;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--muted);font:italic 600 1rem/1 var(--f-py);padding:0;margin-left:4px}
.info[aria-expanded="true"]{background:var(--fg);border-color:var(--fg);color:var(--paper)}
@media (prefers-reduced-motion: reduce){.rail i,.tile{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="hrow"><button class="btn homebtn" id="modeBtn" type="button" hidden>← Home</button><h1 id="title">華語練習 · CLC Mandarin</h1></div>
    <div class="meta" id="meta" hidden>Question <b id="qn">1</b>/<span id="qt">40</span> · Score <b id="sc">0</b> · <b id="clock">0:00</b></div>
  </header>

  <section class="home" id="home" hidden>
    <button class="card" id="vocabCard" type="button">
      <span class="ic">詞彙</span>
      <span class="lbl">Vocab quiz</span>
      <span class="sub" id="vocabSub">Match pinyin and characters, lesson by lesson</span>
    </button>
    <button class="card" id="tonesCard" type="button">
      <span class="ic">聽寫</span>

      <span class="sub">Hear a word, type its pinyin, add the tone marks</span>
    </button>
    <div class="card soon">
      <span class="ic">更多</span>

  <section class="menu" id="menu" hidden>
    <div class="lessons" id="lessons"></div>
  </section>

  <section class="menu" id="tmenu" hidden>
    <div class="modes" id="tlessons"></div>
  </section>

  <div class="rail" id="rail" hidden><i id="bar"></i></div>

  <section class="prompt" id="promptBox" aria-live="polite" hidden>
    <div class="py" id="py"></div>
    <div class="hint" id="hint"></div>
    <div class="tools">
      <button class="btn toggle" id="hintBtn" type="button" aria-pressed="false">English</button>
      <button class="btn toggle" id="lenBtn" type="button" aria-pressed="false">Same length</button>
    </div>
  </section>

  <section class="dict" id="dict" aria-live="polite" hidden>
    <div class="tools">
      <button class="btn primary play" id="playBtn" type="button">▶ Play</button>
      <button class="btn" id="slowBtn" type="button">Slow</button>
    </div>
    <div class="hint" id="dHint"></div>
    <input class="pyin" id="pyIn" type="text" placeholder="Type the pinyin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Pinyin">

    <div class="tools">
      <button class="btn primary" id="dGo" type="button">Add tones</button>

    </div>

  <section class="results" id="results" hidden>
    <h2>結果</h2>

    <div class="tools" style="justify-content:flex-start">
      <button class="btn primary" id="retryBtn" type="button">Retry mistakes</button>
      <button class="btn" id="restartBtn" type="button">Start over (all words)</button>
      <button class="btn" id="menuBtn" type="button">Home</button>
    </div>
  </section>

  <div class="board" id="board" hidden></div>
</div>

<script>
let LESSONS = [];
const $ = id => document.getElementById(id);
let showEn = false, showLen = false;
try { showEn = localStorage.getItem('q_en') === '1'; showLen = localStorage.getItem('q_len') === '1'; } catch(e) {}
let t0 = 0, tick = null;
function fmt(ms){ const t = Math.floor(ms/1000); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }
function stopClock(){ clearInterval(tick); tick = null; }
let ex = 'vocab', endless = false, WORDS = [], lesson = null, mode = 'py2zh', queue = [], idx = 0, score = 0, misses = [], answered = false, firstTry = true;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function buildMenu(){
  const box = $('lessons');
  LESSONS.forEach(L => {
    const sec = el('section','lesson');
    const h = el('h2', null, L.zh + ' · Lesson ' + L.n + ' ');
    h.append(el('small', null, L.words.length + ' words'));
    const modes = el('div','modes');
    const ex = L.words[L.words.length > 17 ? 17 : 0];
    [['py2zh','Pinyin → Characters'],['zh2py','Characters → Pinyin']].forEach(([m,label]) => {
      const b = el('button','mode'); b.type = 'button';
      const e = el('span','ex');
      const py = document.createTextNode(ex[1]); const zh = el('span','h',ex[0]); const arr = el('span','arr','→');
      if (m === 'py2zh') e.append(py,' ',arr,' ',zh); else e.append(zh,' ',arr,' ',py);
      b.append(e, el('span','lbl',label));
      b.addEventListener('click', () => go(lessonPath(L.n, m)));
      modes.append(b);
    });
    sec.append(h, modes); box.append(sec);
  });
}
function hideAll(){
  stopClock(); if (window.speechSynthesis) speechSynthesis.cancel();
  ['home','menu','tmenu','meta','rail','promptBox','results','board','dict'].forEach(id => $(id).hidden = true);
}
function showHome(){
  hideAll(); $('modeBtn').hidden = true;
  $('home').hidden = false; $('title').textContent = '華語練習 · CLC Mandarin';
}
function showMenu(){
  hideAll(); $('modeBtn').hidden = false; $('modeBtn').textContent = '← Home';
  $('menu').hidden = false; $('title').textContent = '華語詞彙 · Vocab Quiz';
}
function buildBoard(){
  const b = $('board'); b.textContent = '';
  b.className = mode === 'zh2py' ? 'board pyb' : 'board';
  shuffle(WORDS).forEach(w => {
    const t = el('button','tile', mode === 'zh2py' ? w[1] : w[0]); t.type = 'button';
    t.dataset.key = w[0];
    t.addEventListener('click', () => pick(t));
    b.append(t);
  });
}
function start(list){
  ex = 'vocab'; endless = false; queue = shuffle(list); idx = 0; score = 0; misses = [];
  $('title').textContent = lesson.zh + ' · Lesson ' + lesson.n;
  $('home').hidden = true; $('menu').hidden = true; $('results').hidden = true;
  $('modeBtn').textContent = '← Lessons';
  ['meta','rail','promptBox','board','modeBtn'].forEach(id => $(id).hidden = false);
  $('qt').textContent = queue.length;
  $('py').className = mode === 'zh2py' ? 'py zhq' : 'py';
  stopClock(); t0 = Date.now(); $('clock').textContent = '0:00';
  tick = setInterval(() => { $('clock').textContent = fmt(Date.now() - t0); }, 250);
  buildBoard(); show(); window.scrollTo(0,0);
}
function show(){
  const w = queue[idx]; answered = false; firstTry = true;
  $('py').textContent = mode === 'zh2py' ? w[0] : w[1];
  $('qn').textContent = idx + 1; $('sc').textContent = score;
  $('bar').style.width = (idx / queue.length * 100) + '%';
  document.querySelectorAll('.tile').forEach(t => { t.className = 'tile'; });
  applyAids();
}
function applyAids(){
  const w = queue[idx]; if (!w) return;
  $('hint').textContent = showEn ? w[2] : '';
  $('hintBtn').setAttribute('aria-pressed', showEn); $('lenBtn').setAttribute('aria-pressed', showLen);
  const n = [...w[0]].length;
  document.querySelectorAll('.tile').forEach(t => {
    const same = [...t.dataset.key].length === n;
    t.classList.toggle('match', showLen && same);
    t.classList.toggle('dim', showLen && !same);
  });
}
function save(){ try { localStorage.setItem('q_en', showEn ? '1' : '0'); localStorage.setItem('q_len', showLen ? '1' : '0'); } catch(e) {} }
function pick(t){
  if (answered) return;
  const w = queue[idx];
  if (t.dataset.key === w[0]) {
    answered = true; t.classList.add('ok');
    if (firstTry) score++;
    $('sc').textContent = score;
    setTimeout(next, 450);
  } else {
    if (firstTry) { misses.push(w); firstTry = false; }
    t.classList.add('bad');
    setTimeout(() => t.classList.remove('bad'), 450);
  }
}
function next(){ idx++; if (idx >= queue.length) return finish(); show(); }
function finish(){
  $('bar').style.width = '100%'; $('promptBox').hidden = true; $('board').hidden = true; $('results').hidden = false;
  stopClock(); const took = fmt(Date.now() - t0); $('clock').textContent = took;
  $('final').textContent = score + ' / ' + (endless ? idx : queue.length) + '  ·  ' + took;
  const m = $('missWrap'); m.textContent = '';
  if (!misses.length) { m.textContent = 'No mistakes. 太棒了！'; $('retryBtn').hidden = true; }
  else {
    $('retryBtn').hidden = false;
    const p = el('p', null, 'Missed on the first try:'); p.style.margin = '0'; m.append(p);
    const g = el('div','miss');
    misses.forEach(w => { g.append(el('span','zh',w[0]), el('span','',w[1]), el('span','en',w[2])); });
    m.append(g);
  }
}
$('hintBtn').addEventListener('click', () => { showEn = !showEn; save(); applyAids(); });
$('lenBtn').addEventListener('click', () => { showLen = !showLen; save(); applyAids(); });
$('retryBtn').addEventListener('click', () => ex === 'tones' ? startTones(misses) : start(misses));
$('restartBtn').addEventListener('click', () => ex === 'tones' ? startTones(WORDS) : start(WORDS));

// ---- Pinyin dictation: hear a word, type its pinyin, then tap vowels to add tone marks ----

// Audio. recordingFor() is where recorded files plug in later: return a URL for the word
// (e.g. '/audio/' + w[0] + '.mp3') and it is played instead of the browser's speech voice.
function recordingFor(w){ return null; }
let zhVoice = null;
function pickVoice(){
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  const find = re => vs.find(v => re.test(v.lang.replace('_','-')));
  // Taiwan Mandarin first, then any other Mandarin voice (never Cantonese).
  zhVoice = find(/^(zh|cmn)-(TW|Hant)/i) || find(/^(zh|cmn)-(CN|Hans)/i) || find(/^cmn/i) || find(/^zh$/i) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }
let player = null;
function playWord(w, slow){
  const src = recordingFor(w);
  if (src) {
    if (player) player.pause();
    player = new Audio(src); player.playbackRate = slow ? 0.7 : 1; player.play().catch(() => {});
    return;
  }
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w[0].replace(/[…。，、\s]/g, ''));
  u.lang = zhVoice ? zhVoice.lang : 'zh-TW'; if (zhVoice) u.voice = zhVoice;
  u.rate = slow ? 0.55 : 0.85;
  speechSynthesis.speak(u);
}
const canSpeak = () => !!window.speechSynthesis;

// Pinyin as letters with tones: [{ch:'x',tone:0},{ch:'i',tone:0},{ch:'ǎ'...}] -> base letter + tone 0-4.
const MARKS = { '\u0304':1, '\u0301':2, '\u030c':3, '\u0300':4 };
const TONED = { a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ' };
function parsePy(s){
  const out = [];
  for (const c of s.toLowerCase().normalize('NFD')) {
    const last = out[out.length - 1];
    if (MARKS[c]) { if (last) last.tone = MARKS[c]; }
    else if (c === '\u0308') { if (last && last.ch === 'u') last.ch = 'ü'; }
    else out.push({ ch: c, tone: 0, letter: /[a-z]/.test(c) });
  }
  return out;
}
const letterOf = (ch, tone) => tone && TONED[ch] ? TONED[ch][tone - 1] : ch;
// Spelling check ignores tones, spaces and punctuation; "v" or "u" may stand for "ü".
const spelling = s => parsePy(s.replace(/v/gi, 'ü')).filter(x => x.letter || x.ch === 'ü').map(x => x.ch === 'ü' ? 'u' : x.ch).join('');

let stage = 'type', target = [], marks = [], spelledOk = true, typed = '', tipOpen = false;
const TONE_TIP = 'Tap a vowel to cycle its tone: ā á ǎ à, then none.';

// Endless mode: every word from every lesson (each distinct word once), reshuffled each round.
function allWords(){
  const seen = new Set(), out = [];
  LESSONS.forEach(L => L.words.forEach(w => { const k = w[0] + '|' + w[1]; if (!seen.has(k)) { seen.add(k); out.push(w); } }));
  return out;
}
function buildTonesMenu(){
  const box = $('tlessons');
  const all = el('button','mode'); all.type = 'button';
  const ae = el('span','ex'); ae.append(el('span','h','全部'), el('span','arr','∞'));
  all.append(ae, el('span','lbl','Endless · all lessons'), el('span','sub', allWords().length + ' words, shuffled, until you stop'));
  all.addEventListener('click', () => go('/tones/endless'));
  box.append(all);
  LESSONS.forEach(L => {
    const b = el('button','mode'); b.type = 'button';
    const e = el('span','ex'); e.append(el('span','h',L.zh));
    b.append(e, el('span','lbl','Lesson ' + L.n), el('span','sub', L.words.length + ' words'));
    b.addEventListener('click', () => go('/tones/lesson-' + L.n));
    box.append(b);
  });
}
function showTonesMenu(){
  hideAll(); $('modeBtn').hidden = false; $('modeBtn').textContent = '← Home';
  $('tmenu').hidden = false; $('title').textContent = '聽寫 · Pinyin Dictation';
}
function startTones(list){
  ex = 'tones'; endless = !!lesson.endless && list === WORDS; queue = shuffle(list); idx = 0; score = 0; misses = [];
  hideAll();
  $('title').textContent = '聽寫 · ' + lesson.zh;
  $('modeBtn').textContent = '← Lessons';
  ['meta','dict','modeBtn'].forEach(id => $(id).hidden = false);
  $('rail').hidden = endless; $('dEnd').hidden = !endless;
  $('qt').textContent = endless ? '∞' : queue.length;
  t0 = Date.now(); $('clock').textContent = '0:00';
  tick = setInterval(() => { $('clock').textContent = fmt(Date.now() - t0); }, 250);
  showWord(); window.scrollTo(0,0);
}
// Characters and English stay hidden until the word is checked (or when there is no audio).
function dictAids(){
  const w = queue[idx]; if (!w) return;
  const h = $('dHint'); h.textContent = '';
  if (stage === 'done' || !canSpeak()) h.append(el('span','zh',w[0]), ' ', w[2]);
}
function showWord(){
  const w = queue[idx];
  stage = 'type'; spelledOk = true; target = parsePy(w[1]); marks = target.map(() => 0);
  $('qn').textContent = idx + 1; $('sc').textContent = score;
  $('bar').style.width = (idx / queue.length * 100) + '%';
  $('pyIn').value = ''; $('pyIn').hidden = false; $('letters').hidden = true;
  $('dFb').textContent = ''; $('dFb').className = 'fb';
  $('dSub').textContent = canSpeak() ? '' : "This browser can't play audio, so here are the characters.";
  $('dGo').textContent = 'Add tones';
  dictAids();
  $('pyIn').focus({ preventScroll: true });
  playWord(w);
}
function renderLetters(){
  const box = $('letters'); box.textContent = '';
  let syl = el('span','syl');
  target.forEach((x, i) => {
    if (!x.letter && x.ch !== 'ü') {
      if (syl.childNodes.length) box.append(syl);
      syl = el('span','syl');
      if (x.ch.trim()) box.append(el('span','sep',x.ch));
      return;
    }
    if (TONED[x.ch]) {
      const b = el('button','lt', letterOf(x.ch, marks[i])); b.type = 'button';
      b.classList.toggle('set', marks[i] > 0);
      b.setAttribute('aria-label', x.ch + (marks[i] ? ' tone ' + marks[i] : ' no tone'));
      b.dataset.i = i;
      b.addEventListener('click', () => { if (stage !== 'tone') return; marks[i] = (marks[i] + 1) % 5; renderLetters(); box.querySelector('[data-i="' + i + '"]').focus(); });
      if (stage === 'done') { b.disabled = true; b.classList.add(marks[i] === x.tone ? (x.tone ? 'ok' : 'x') : 'bad'); }
      syl.append(b);
    } else syl.append(el('span','cs',x.ch));
  });
  if (syl.childNodes.length) box.append(syl);
  // The tip shows by itself on the first word; after that it sits behind a small "i" button.
  if (stage === 'tone' && idx > 0) {
    const i = el('button','info','i'); i.type = 'button';
    i.setAttribute('aria-label', 'How to add tones'); i.setAttribute('aria-expanded', tipOpen);
    i.addEventListener('click', () => { tipOpen = !tipOpen; $('dSub').textContent = tipOpen ? TONE_TIP : ''; i.setAttribute('aria-expanded', tipOpen); });
    box.append(i);
  }
}
function toTones(){
  const w = queue[idx];
  typed = $('pyIn').value.trim();
  if (!spelling(typed)) { $('pyIn').focus(); return; }
  spelledOk = spelling(typed) === spelling(w[1]);
  stage = 'tone'; tipOpen = false;
  $('pyIn').hidden = true; $('pyIn').blur(); $('letters').hidden = false;
  renderLetters();
  if (spelledOk) { $('dFb').textContent = ''; }
  else { $('dFb').className = 'fb bad'; $('dFb').textContent = 'Not quite: you typed “' + typed + '”. Here is the right spelling.'; }
  $('dSub').textContent = idx === 0 ? TONE_TIP : '';
  $('dGo').textContent = 'Check';
}
function syllableTones(ts){
  const out = []; let cur = [];
  target.forEach((x, i) => {
    if (!x.letter && x.ch !== 'ü') { if (cur.length) out.push(cur.sort().join()); cur = []; return; }
    if (ts[i]) cur.push(ts[i]);
  });
  if (cur.length) out.push(cur.sort().join());
  return out.join('|');
}
function check(){
  const w = queue[idx];
  const exact = target.every((x, i) => marks[i] === x.tone);
  const right = exact && spelledOk;
  stage = 'done';
  if (right) score++; else if (!misses.includes(w)) misses.push(w);
  $('sc').textContent = score;
  renderLetters();
  const fb = $('dFb'); fb.textContent = ''; fb.className = 'fb ' + (right ? 'ok' : 'bad');
  if (right) fb.textContent = '對！ ' + w[1];
  else {
    const tonesRight = syllableTones(marks) === syllableTones(target.map(x => x.tone));
    // Spelling mistakes repeat what was typed; "tones right" is only said when the word has tones to get right.
    const hasTones = target.some(x => x.tone);
    const why = !spelledOk ? 'You typed “' + typed + '”' + (exact && hasTones ? ', tones right. ' : '. ')
      : (tonesRight ? 'Right tones, but a mark is on the wrong letter. ' : '');
    fb.textContent = why + 'Answer: ' + w[1];
  }
  $('dSub').textContent = '';
  $('dGo').textContent = endless || idx + 1 < queue.length ? 'Next word' : 'See results';
  dictAids();
  $('dGo').focus({ preventScroll: true });
}
function advance(){
  if (stage === 'type') return toTones();
  if (stage === 'tone') return check();
  idx++;
  if (idx >= queue.length) {
    if (endless) queue = queue.concat(shuffle(WORDS));
    else { $('dict').hidden = true; return finish(); }
  }
  showWord();
}
$('dEnd').addEventListener('click', () => {
  if (stage === 'done') idx++;   // count the word just checked
  $('dict').hidden = true; finish();
});
$('dGo').addEventListener('click', advance);
$('pyIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); advance(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || $('dict').hidden || stage === 'type' || e.target === $('pyIn')) return;
  e.preventDefault(); advance();
});
$('playBtn').addEventListener('click', () => playWord(queue[idx]));
$('slowBtn').addEventListener('click', () => playWord(queue[idx], true));
// URLs: "/" is the home menu, "/vocab" the lesson list, "/vocab/lesson-<n>-py-zh" and
// "/vocab/lesson-<n>-zh-py" open a quiz, "/tones" and "/tones/lesson-<n>" are the pinyin dictation, so the phone's back gesture moves between screens
// instead of closing the app. Old "/lesson-..." links are redirected to "/vocab/lesson-...".
const SLUG = { py2zh: 'py-zh', zh2py: 'zh-py' };
function lessonPath(n, m){ return '/vocab/lesson-' + n + '-' + SLUG[m]; }
function parentOf(path){
  if (path === '/vocab' || path === '/tones') return '/';
  return path.startsWith('/vocab/') ? '/vocab' : path.startsWith('/tones/') ? '/tones' : null;
}
function route(){
  const path = location.pathname.replace(/\/+$/, '') || '/';
  if (path === '/vocab') return showMenu();
  if (path === '/tones') return showTonesMenu();
  if (path === '/tones/endless') { lesson = { zh: '全部 ∞', endless: true, words: allWords() }; WORDS = lesson.words; return startTones(WORDS); }
  const t = path.match(/^\/tones\/lesson-(\d+)$/);
  const TL = t && LESSONS.find(x => x.n === +t[1]);
  if (TL) { lesson = TL; WORDS = TL.words; return startTones(WORDS); }
  const r = path.match(/^\/vocab\/lesson-(\d+)-(py-zh|zh-py)$/);
  const L = r && LESSONS.find(x => x.n === +r[1]);
  if (!L) { if (location.pathname !== '/') history.replaceState(null, '', '/'); showHome(); return; }
  lesson = L; WORDS = L.words; mode = r[2] === 'zh-py' ? 'zh2py' : 'py2zh'; start(WORDS);
}
function go(path){ history.pushState({ parent: location.pathname }, '', path); route(); }
function goUp(){
  // Opened from the parent screen: step back so the history doesn't pile up. Otherwise replace.
  const parent = parentOf(location.pathname) || '/';
  if (history.state && history.state.parent === parent) history.back();
  else { history.replaceState(null, '', parent); route(); }
}
window.addEventListener('popstate', route);
$('menuBtn').addEventListener('click', goUp);
$('modeBtn').addEventListener('click', goUp);
$('vocabCard').addEventListener('click', () => go('/vocab'));
$('tonesCard').addEventListener('click', () => go('/tones'));
fetch('/lessons.json', {cache: 'no-cache'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    LESSONS = data; buildMenu(); buildTonesMenu();
    $('vocabSub').textContent = LESSONS.length + ' lessons · match pinyin and characters';
    let path = location.pathname.replace(/\/+$/, '') || '/';
    if (path === '/index.html') path = '/';
    if (/^\/lesson-\d+-(py-zh|zh-py)$/.test(path)) path = '/vocab' + path;
    // Opened straight on an inner URL: put its parent screens behind it so "back" walks up.
    if (path !== location.pathname || (path !== '/' && !(history.state && history.state.parent))) {
      const chain = [];
      for (let p = path; p; p = parentOf(p)) chain.unshift(p);
      if (chain[0] !== '/') chain.splice(0, chain.length, '/');
      history.replaceState(null, '', chain[0]);
      for (let i = 1; i < chain.length; i++) history.pushState({ parent: chain[i-1] }, '', chain[i]);
    }
    route();
  })
  .catch(() => { showMenu(); $('lessons').textContent = 'Could not load lessons. Check your connection and reload.'; });
</script>
