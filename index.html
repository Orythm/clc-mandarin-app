/* Layout: prompt card on top (pinyin), 40-tile character board below, progress rail in the header */
:root{
  --bg:#f3f4f1; --paper:#fff; --fg:#1d2320; --muted:#68716c; --line:#dde1dc;
  --accent:#a3322a; --ok:#2f7a4a; --ok-soft:#e3f1e8; --bad:#b3362c; --bad-soft:#f7e3e0;
  --f-hand:"WenKai Embedded","LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --f-py:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --paper:#1d2320; --fg:#e7ece8; --muted:#9ba59f; --line:#2f3733;
  --accent:#e0776c; --ok:#6cc48d; --ok-soft:#1e3327; --bad:#ec7b70; --bad-soft:#3b2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --paper:#1d2320; --fg:#e7ece8; --muted:#9ba59f; --line:#2f3733;
  --accent:#e0776c; --ok:#6cc48d; --ok-soft:#1e3327; --bad:#ec7b70; --bad-soft:#3b2220; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-py)}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
h1{font-family:var(--f-hand);font-size:1.8rem;margin:0}
.meta{font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg)}
.rail{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;text-align:center;display:grid;gap:6px;min-height:150px;align-content:center}
.py{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:600;letter-spacing:.01em}
.hint{color:var(--muted);font-style:italic;font-size:1.05rem;min-height:1.4em}
.fb{font-size:1.15rem;min-height:1.6em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb .zh{font-family:var(--f-hand);font-size:1.6rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;cursor:pointer}
.btn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 14px;font-size:1rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-family:var(--f-hand);font-size:1.9rem;color:var(--fg);min-height:70px;transition:background .15s,border-color .15s}
.tile:hover{border-color:var(--muted)}
.tile.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tile.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tile:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.results{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:grid;gap:12px}
.results h2{font-family:var(--f-hand);font-size:1.6rem;margin:0}
.score{font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.miss{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline}
.miss .zh{font-family:var(--f-hand);font-size:1.7rem}
.miss .en{color:var(--muted);font-style:italic}
.prompt{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
@media (max-width:560px){
  .wrap{gap:10px;padding-block:12px 32px}
  h1{font-size:1.4rem}
  .prompt{min-height:0;padding:12px}
  .py{font-size:2.1rem}
  .board{grid-template-columns:repeat(5,1fr);gap:6px}
  .tile{font-size:1.2rem;min-height:54px;padding:6px 2px;white-space:nowrap}
}

.py.zhq{font-family:var(--f-hand);font-weight:700;font-size:clamp(3rem,10vw,4.4rem)}
.board.pyb .tile{font-family:var(--f-py);font-size:1.15rem}
.board.pyb{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.menu{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 16px;display:grid;gap:14px}
.menu p{margin:0;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:left;color:var(--fg);display:grid;gap:6px}
.mode:hover{border-color:var(--accent)}
.mode .ex{font-size:1.6rem;display:flex;align-items:baseline;gap:10px}
.mode .ex .h{font-family:var(--f-hand);font-size:2rem}
.mode .ex .arr{color:var(--accent)}
.mode .lbl{font-weight:600;font-size:1.1rem}
.mode .sub{color:var(--muted);font-size:.95rem}
.btn.toggle[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--paper)}
.tile.match{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.dim{opacity:.35}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.homebtn{padding:6px 12px;font-size:.95rem}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:1rem;text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){
  .board.pyb{grid-template-columns:repeat(4,1fr)}
  .board.pyb .tile{font-size:.9rem;white-space:normal;line-height:1.2}
  .py.zhq{font-size:3rem}
}
.lessons{display:grid;gap:18px}
.lesson h2{font-family:var(--f-hand);font-size:1.4rem;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
.lesson h2 small{font-family:var(--f-py);font-size:.9rem;color:var(--muted);font-weight:400}
.mode{padding:14px}
.mode .ex{font-size:1.3rem}
.mode .ex .h{font-size:1.6rem}
@media (prefers-reduced-motion: reduce){.rail i,.tile{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="hrow"><button class="btn homebtn" id="modeBtn" type="button" hidden>← Home</button><h1 id="title">華語詞彙 · Vocab Quiz</h1></div>
    <div class="meta" id="meta" hidden>Question <b id="qn">1</b>/<span id="qt">40</span> · Score <b id="sc">0</b> · <b id="clock">0:00</b></div>
  </header>

  <section class="menu" id="menu">
    <p>Pick a lesson and a direction.</p>
    <div class="lessons" id="lessons"></div>
  </section>

  <div class="rail" id="rail" hidden><i id="bar"></i></div>

  <section class="prompt" id="promptBox" aria-live="polite" hidden>
    <div class="py" id="py"></div>
    <div class="hint" id="hint"></div>
    <div class="tools">
      <button class="btn toggle" id="hintBtn" type="button" aria-pressed="false">English</button>
      <button class="btn toggle" id="lenBtn" type="button" aria-pressed="false">Same length</button>
    </div>
  </section>

  <section class="results" id="results" hidden>
    <h2>結果</h2>
    <div class="score" id="final"></div>
    <div id="missWrap"></div>
    <div class="tools" style="justify-content:flex-start">
      <button class="btn primary" id="retryBtn" type="button">Retry mistakes</button>
      <button class="btn" id="restartBtn" type="button">Start over (all words)</button>
      <button class="btn" id="menuBtn" type="button">Home</button>
    </div>
  </section>

  <div class="board" id="board" hidden></div>
</div>

<script>
let LESSONS = [];
const $ = id => document.getElementById(id);
let showEn = false, showLen = false;
try { showEn = localStorage.getItem('q_en') === '1'; showLen = localStorage.getItem('q_len') === '1'; } catch(e) {}
let t0 = 0, tick = null;
function fmt(ms){ const t = Math.floor(ms/1000); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }
function stopClock(){ clearInterval(tick); tick = null; }
let WORDS = [], lesson = null, mode = 'py2zh', queue = [], idx = 0, score = 0, misses = [], answered = false, firstTry = true;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function buildMenu(){
  const box = $('lessons');
  LESSONS.forEach(L => {
    const sec = el('section','lesson');
    const h = el('h2', null, L.zh + ' · Lesson ' + L.n + ' ');
    h.append(el('small', null, L.words.length + ' words'));
    const modes = el('div','modes');
    const ex = L.words[L.words.length > 17 ? 17 : 0];
    [['py2zh','Pinyin → Characters'],['zh2py','Characters → Pinyin']].forEach(([m,label]) => {
      const b = el('button','mode'); b.type = 'button';
      const e = el('span','ex');
      const py = document.createTextNode(ex[1]); const zh = el('span','h',ex[0]); const arr = el('span','arr','→');
      if (m === 'py2zh') e.append(py,' ',arr,' ',zh); else e.append(zh,' ',arr,' ',py);
      b.append(e, el('span','lbl',label));
      b.addEventListener('click', () => { lesson = L; WORDS = L.words; mode = m; start(WORDS); });
      modes.append(b);
    });
    sec.append(h, modes); box.append(sec);
  });
}
function showMenu(){
  stopClock();
  ['meta','rail','promptBox','results','board'].forEach(id => $(id).hidden = true);
  $('modeBtn').hidden = true;
  $('menu').hidden = false; $('title').textContent = '華語詞彙 · Vocab Quiz';
}
function buildBoard(){
  const b = $('board'); b.textContent = '';
  b.className = mode === 'zh2py' ? 'board pyb' : 'board';
  shuffle(WORDS).forEach(w => {
    const t = el('button','tile', mode === 'zh2py' ? w[1] : w[0]); t.type = 'button';
    t.dataset.key = w[0];
    t.addEventListener('click', () => pick(t));
    b.append(t);
  });
}
function start(list){
  queue = shuffle(list); idx = 0; score = 0; misses = [];
  $('title').textContent = lesson.zh + ' · Lesson ' + lesson.n;
  $('menu').hidden = true; $('results').hidden = true;
  ['meta','rail','promptBox','board','modeBtn'].forEach(id => $(id).hidden = false);
  $('qt').textContent = queue.length;
  $('py').className = mode === 'zh2py' ? 'py zhq' : 'py';
  stopClock(); t0 = Date.now(); $('clock').textContent = '0:00';
  tick = setInterval(() => { $('clock').textContent = fmt(Date.now() - t0); }, 250);
  buildBoard(); show(); window.scrollTo(0,0);
}
function show(){
  const w = queue[idx]; answered = false; firstTry = true;
  $('py').textContent = mode === 'zh2py' ? w[0] : w[1];
  $('qn').textContent = idx + 1; $('sc').textContent = score;
  $('bar').style.width = (idx / queue.length * 100) + '%';
  document.querySelectorAll('.tile').forEach(t => { t.className = 'tile'; });
  applyAids();
}
function applyAids(){
  const w = queue[idx]; if (!w) return;
  $('hint').textContent = showEn ? w[2] : '';
  $('hintBtn').setAttribute('aria-pressed', showEn); $('lenBtn').setAttribute('aria-pressed', showLen);
  const n = [...w[0]].length;
  document.querySelectorAll('.tile').forEach(t => {
    const same = [...t.dataset.key].length === n;
    t.classList.toggle('match', showLen && same);
    t.classList.toggle('dim', showLen && !same);
  });
}
function save(){ try { localStorage.setItem('q_en', showEn ? '1' : '0'); localStorage.setItem('q_len', showLen ? '1' : '0'); } catch(e) {} }
function pick(t){
  if (answered) return;
  const w = queue[idx];
  if (t.dataset.key === w[0]) {
    answered = true; t.classList.add('ok');
    if (firstTry) score++;
    $('sc').textContent = score;
    setTimeout(next, 450);
  } else {
    if (firstTry) { misses.push(w); firstTry = false; }
    t.classList.add('bad');
    setTimeout(() => t.classList.remove('bad'), 450);
  }
}
function next(){ idx++; if (idx >= queue.length) return finish(); show(); }
function finish(){
  $('bar').style.width = '100%'; $('promptBox').hidden = true; $('board').hidden = true; $('results').hidden = false;
  stopClock(); const took = fmt(Date.now() - t0); $('clock').textContent = took;
  $('final').textContent = score + ' / ' + queue.length + '  ·  ' + took;
  const m = $('missWrap'); m.textContent = '';
  if (!misses.length) { m.textContent = 'No mistakes. 太棒了！'; $('retryBtn').hidden = true; }
  else {
    $('retryBtn').hidden = false;
    const p = el('p', null, 'Missed on the first try:'); p.style.margin = '0'; m.append(p);
    const g = el('div','miss');
    misses.forEach(w => { g.append(el('span','zh',w[0]), el('span','',w[1]), el('span','en',w[2])); });
    m.append(g);
  }
}
$('hintBtn').addEventListener('click', () => { showEn = !showEn; save(); applyAids(); });
$('lenBtn').addEventListener('click', () => { showLen = !showLen; save(); applyAids(); });
$('retryBtn').addEventListener('click', () => start(misses));
$('restartBtn').addEventListener('click', () => start(WORDS));
$('menuBtn').addEventListener('click', showMenu);
$('modeBtn').addEventListener('click', showMenu);
fetch('/lessons.json', {cache: 'no-cache'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => { LESSONS = data; buildMenu(); showMenu(); })
  .catch(() => { showMenu(); $('lessons').textContent = 'Could not load lessons. Check your connection and reload.'; });
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js');});}</script>
</body></html>
